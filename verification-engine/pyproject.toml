
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepyourid-verifier"
version = "0.1.0"
description = "Independent credential verification engine for KeepYourID"
requires-python = ">=3.10"
dependencies = [
    "eth-account>=0.13.0",
    "eth-utils>=5.0.0",
    "web3>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
